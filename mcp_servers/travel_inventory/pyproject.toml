[project]
name = "atlastrip-inventory-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing AtlasTrip travel inventory as tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlastrip-core",
    "mcp>=1.9",
]

[project.scripts]
atlastrip-inventory-mcp = "travel_inventory_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_inventory_mcp"]

[tool.uv.sources]
atlastrip-core = { path = "../../packages/atlastrip_core", editable = true }
