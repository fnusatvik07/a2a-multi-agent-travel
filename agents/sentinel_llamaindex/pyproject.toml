[project]
name = "atlastrip-sentinel"
version = "0.1.0"
description = "Policy and visa compliance agent, built on LlamaIndex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlastrip-core",
    "llama-index-core>=0.14",
    "llama-index-llms-openai>=0.6",
    "llama-index-embeddings-openai>=0.5",
    "llama-index-tools-mcp>=0.5",
]

[project.scripts]
atlastrip-sentinel = "sentinel_llamaindex.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_llamaindex"]

[tool.uv.sources]
atlastrip-core = { path = "../../packages/atlastrip_core", editable = true }
