[project]
name = "atlastrip-skyline"
version = "0.1.0"
description = "Flight sourcing agent, built on Google ADK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlastrip-core",
    "google-adk>=2.8",
    "litellm>=1.60",
]

[project.scripts]
atlastrip-skyline = "skyline_adk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyline_adk"]

[tool.uv.sources]
atlastrip-core = { path = "../../packages/atlastrip_core", editable = true }
