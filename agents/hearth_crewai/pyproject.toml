[project]
name = "atlastrip-hearth"
version = "0.1.0"
description = "Lodging agent, built on CrewAI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "atlastrip-core",
    "crewai>=1.15",
    "crewai-tools[mcp]>=1.6",
]

[project.scripts]
atlastrip-hearth = "hearth_crewai.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearth_crewai"]

[tool.uv.sources]
atlastrip-core = { path = "../../packages/atlastrip_core", editable = true }
