<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    var root = document.querySelector('[data-composition-id="10-close"]');
    var words = root.querySelectorAll('#close-line-a .close-word');
    var cards = root.querySelectorAll('#close-assembly .close-card');
    var repoText = root.querySelector('#close-repo-text');
    var REPO = 'github.com/fnusatvik07/a2a-multi-agent-travel';

    /* ---- Scene 1 (0.0-2.2s): the rail recedes, the assembly returns, the claim assembles ---- */

    // station rail recedes (final frame: the stage clears for the mark)
    tl.fromTo('#close-rail',
      { opacity: 1, y: 0 },
      { opacity: 0, y: 26, duration: 0.7, ease: 'power2.in' }, 0.05);

    // the Frame 4 assembly returns behind it, complete and still, at ~30%
    tl.fromTo('#close-assembly',
      { opacity: 0 },
      { opacity: 0.16, duration: 0.9, ease: 'power2.out' }, 0.1);

    // per-word staggered reveal of the claim
    words.forEach(function (w, i) {
      tl.fromTo(w,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' },
        0.18 + i * 0.11);
    });

    /* ---- Scene 2 (2.2-4.0s): the claim recedes to 40% ink, the payoff line lands ---- */

    tl.to('#close-line-a', { color: 'rgba(20, 20, 19, 0.4)', duration: 0.5, ease: 'power2.out' }, 2.2);

    tl.fromTo('#close-line-b',
      { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 2.25);

    // the five cards flash their hairline border once, in sequence, then go quiet
    cards.forEach(function (c, i) {
      var at = 2.6 + i * 0.17;
      tl.to(c, { borderColor: 'rgba(20, 20, 19, 0.42)', duration: 0.16, ease: 'power2.out' }, at);
      tl.to(c, { borderColor: 'rgba(20, 20, 19, 0.12)', duration: 0.28, ease: 'power2.inOut' }, at + 0.16);
    });

    /* ---- Scene 3 (4.0-6.1s): both lines clear upward, the lockup lands and holds ---- */

    tl.to('#close-line-a', { opacity: 0, y: -62, duration: 0.46, ease: 'power2.in' }, 4.0);
    tl.to('#close-line-b', { opacity: 0, y: -62, duration: 0.46, ease: 'power2.in' }, 4.06);
    tl.to('#close-assembly', { opacity: 0.12, duration: 0.7, ease: 'power2.out' }, 4.05);

    // the single overshoot in the film — kept small
    tl.fromTo('#close-wordmark',
      { opacity: 0, scale: 0.62 },
      { opacity: 1, scale: 1, duration: 0.55, ease: 'back.out(1.25)' }, 4.35);

    // the repo line types on beneath it, in mono, with a caret
    tl.fromTo('#close-repo', { opacity: 0 }, { opacity: 1, duration: 0.22, ease: 'power2.out' }, 4.82);
    tl.fromTo('#close-caret', { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, 4.86);

    var typed = { n: 0 };
    tl.to(typed, {
      n: REPO.length,
      duration: 0.68,
      ease: 'none',
      snap: { n: 1 },
      onUpdate: function () {
        repoText.textContent = REPO.slice(0, Math.round(typed.n));
      }
    }, 4.9);

    // the caret retires; nothing moves after this
    tl.to('#close-caret', { opacity: 0, duration: 0.16, ease: 'none' }, 5.62);

    // held to the end — no drift, no glow, no outro sting
    tl.to({}, { duration: 0.34 }, 5.78);

    window.__timelines['10-close'] = tl;
  })();
</script>
