  </style>

  <div id="root" data-composition-id="06-the-request" data-width="1920" data-height="1080">

    <div class="clip f06r-stage" data-start="0" data-duration="8.9" data-track-index="1">

      <div class="f06r-kicker" id="f06-the-request-kicker">The request</div>

      <div class="f06r-plate" id="f06-the-request-plate">
        <div class="f06r-line"><span id="f06-the-request-typed"></span><span class="f06r-caret" id="f06-the-request-caret"></span></div>
      </div>

      <svg class="f06r-wires" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">

        <path class="f06r-wire" id="f06-the-request-wire-a" pathLength="1000" d="M240 640 Q420 440 600 640"/>

      <!-- Concierge -->
      <div class="f06r-agent" id="f06-the-request-ag-0" style="left:240px">

      <!-- Skyline -->
      <div class="f06r-agent" id="f06-the-request-ag-1" style="left:600px">

          <path d="M10 22 H54"/>

      <!-- envelopes: solid = work going out -->
      <div class="f06r-env" id="f06-the-request-env-a" style="left:180px;top:616px">
        <span class="f06r-flap"></span><span class="f06r-word">flights</span>
      </div>
      <div class="f06r-env" id="f06-the-request-env-b" style="left:180px;top:616px">
        <span class="f06r-flap"></span><span class="f06r-word">a room</span>
      </div>

    </div>
  </div>

  <script>
    (function () {
      var root = document.querySelector('[data-composition-id="06-the-request"]');
      if (!root) return;
      var q = function (s) { return root.querySelector(s); };

      var plate   = q('#f06-the-request-plate');
      var kicker  = q('#f06-the-request-kicker');
      var typed   = q('#f06-the-request-typed');
      var caret   = q('#f06-the-request-caret');
      var stem    = q('#f06-the-request-stem');
      var wireA   = q('#f06-the-request-wire-a');
      var wireB   = q('#f06-the-request-wire-b');
      var envA    = q('#f06-the-request-env-a');
      var envB    = q('#f06-the-request-env-b');

      var agents = [];
      var glyphs = [];
      for (var i = 0; i < 5; i++) {
        var a = q('#f06-the-request-ag-' + i);
        agents.push(a);
        glyphs.push(a.querySelector('.f06r-glyph'));
      }
      var rules = [q('#f06-the-request-rule-1'), q('#f06-the-request-rule-2')];

      var LINE = "Get Mira to Tokyo, 14 to 17 October, near the customer's office.";
      var proxy = { n: 0 };
      var renderText = function () { typed.textContent = LINE.slice(0, Math.round(proxy.n)); };
      renderText();

      // normalised path lengths (pathLength="1000")
      [stem, wireA, wireB].forEach(function (p) {
        p.style.strokeDasharray = '1000';
        p.style.strokeDashoffset = '1000';
      });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines['06-the-request'] = tl;

      /* ---------- Scene 1 (0.0-4.6s) : the agents recede to ground, the plate seats and types ---------- */

      tl.fromTo(agents,
        { opacity: 0, y: 16 },
        { opacity: 0.35, y: 0, duration: 0.55, ease: 'power3.out', stagger: 0.07 }, 0.0);

      tl.fromTo(plate,
        { opacity: 0, y: 24, scale: 0.99 },
        { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: 'power3.out' }, 0.15);

      tl.fromTo(kicker,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, 0.30);

      // caret blinks, then leads the typing
      tl.set(caret, { opacity: 1 }, 0.58);
      tl.set(caret, { opacity: 0 }, 0.74);
      tl.set(caret, { opacity: 1 }, 0.90);

      var chunks = [
        { to: 18, at: 1.05, dur: 0.90 },
        { to: 36, at: 2.09, dur: 0.78 },
        { to: 64, at: 2.99, dur: 1.16 }
      ];
      var from = 0;
      chunks.forEach(function (c) {
        tl.to(proxy, {
          n: c.to,
          duration: c.dur,
          ease: 'steps(' + (c.to - from) + ')',
          onUpdate: renderText
        }, c.at);
        from = c.to;
      });

      /* ---------- Scene 2 (4.6-6.2s) : the caret stops, the plate goes ink-strong, the bell brightens ---------- */

      tl.to(caret, { opacity: 0, duration: 0.30, ease: 'power2.out' }, 4.62);

      tl.to(plate, { borderColor: 'rgba(20,20,19,0.42)', duration: 0.28, ease: 'power3.out' }, 4.72);
      tl.to(plate, { borderColor: 'rgba(20,20,19,0.20)', duration: 0.55, ease: 'power3.out' }, 5.10);

      // the Concierge reads it - a hairline drops from the plate to the bell
      tl.to(stem, { strokeDashoffset: 0, duration: 0.60, ease: 'power2.inOut' }, 4.85);

      tl.to(agents[0], { opacity: 1, duration: 0.50, ease: 'power3.out' }, 5.30);
      tl.to(glyphs[0], { scale: 1.07, duration: 0.30, ease: 'power3.out' }, 5.30);
      tl.to(glyphs[0], { scale: 1, duration: 0.45, ease: 'power3.out' }, 5.60);

      /* ---------- Scene 3 (6.2-8.9s) : two solid envelopes leave at the same moment ---------- */

      var flights = [
        { el: envA, wire: wireA, dx: 360, apex: 100, tilt: -7 },
        { el: envB, wire: wireB, dx: 720, apex: 165, tilt: -9 }
      ];

      flights.forEach(function (f) {
        tl.fromTo(f.el,
          { opacity: 0, scale: 0.86, x: 0, y: 0 },
          { opacity: 1, scale: 1, duration: 0.20, ease: 'power3.out' }, 6.20);

        // thrown: x carries across, y lifts then falls, rotation settles level on arrival
        tl.to(f.el, { x: f.dx, duration: 1.30, ease: 'power1.inOut' }, 6.28);
        tl.to(f.el, { y: -f.apex, duration: 0.62, ease: 'power2.out' }, 6.28);
        tl.to(f.el, { y: 0, duration: 0.68, ease: 'power2.in' }, 6.90);
        tl.fromTo(f.el, { rotation: f.tilt }, { rotation: 0, duration: 1.30, ease: 'power3.out' }, 6.28);

        // the wire is drawn by the envelope that travels it
        tl.to(f.wire, { strokeDashoffset: 0, duration: 1.30, ease: 'power1.inOut' }, 6.28);

        // the catch
        tl.to(f.el, { scale: 0.94, duration: 0.10, ease: 'power2.out' }, 7.58);
        tl.to(f.el, { scale: 1, duration: 0.26, ease: 'power3.out' }, 7.68);
      });

      // both receiving glyphs brighten to full ink as their envelope lands
      [1, 2].forEach(function (i) {
        tl.to(agents[i], { opacity: 1, duration: 0.50, ease: 'power3.out' }, 7.58);
        tl.to(glyphs[i], { scale: 1.07, duration: 0.28, ease: 'power3.out' }, 7.58);
        tl.to(glyphs[i], { scale: 1, duration: 0.45, ease: 'power3.out' }, 7.86);
      });

      // the hold: the wires quieten and the two commissioned agents are ruled under
      tl.to([wireA, wireB], { strokeOpacity: 0.14, duration: 0.55, ease: 'power2.out' }, 8.10);

      tl.fromTo(rules,
        { scaleX: 0, transformOrigin: 'left center' },
        { scaleX: 1, duration: 0.52, ease: 'power3.out', stagger: 0.09 }, 8.18);

      // pad the timeline to the frame's full length (no exit - this is not the final frame)
      tl.to({}, { duration: 0.01 }, 8.89);
    })();
  </script>
</template>
