        var el = $(sel);
        var len = 0;
        try {
          len = el.getTotalLength();
        } catch (e) {
          len = 0;
        }
        if (!len) len = Number(el.getAttribute("data-len")) || 1000;
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
        tl.fromTo(
          el,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: dur, ease: ease || "none" },
          at,
        );

      // ── SCENE 1 — the judgement (VO 0.04 "That room is $18 over policy") ──
      // The hotel card carries over from Frame 6's right lane into the left 70.
      tl.fromTo(
        "#f07-card-old",
        { x: 56, opacity: 0.55 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
