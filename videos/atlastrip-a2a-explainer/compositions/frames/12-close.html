  <script>
    (function () {
      var gsap = window.gsap;

      var repoEl = document.getElementById("f12-close-repo");
      var REPO = "github.com/fnusatvik07/a2a-multi-agent-travel";
      for (var i = 0; i < REPO.length; i++) {
        var s = document.createElement("span");
        s.textContent = REPO.charAt(i);
        repoEl.appendChild(s);
      }
      var repoChars = repoEl.querySelectorAll("span");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["12-close"] = tl;

      /* — Scene 1 (0.0–3.0s): the rail recedes; the cast returns as texture — */
      tl.fromTo("#f12-close-rail",

        { opacity: 0.16, scale: 1, duration: 1.5, ease: "power3.out" }, 0);

      /* three beats, centred */

        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.15);
      tl.fromTo(".f12-close-beat-2",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 1.05);
      tl.fromTo(".f12-close-beat-3",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 1.95);

      /* the beats drop back AND clear upward — off the claim's ground entirely */
      tl.to("#f12-close-beats",
        { opacity: 0, y: -190, duration: 0.65, ease: "power2.in" }, 2.95);

      /* — Scene 2 (3.75–7.2s): the claim has the frame to itself — */
      tl.fromTo("#f12-close-line-1",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 3.75);
      tl.fromTo("#f12-close-line-2",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 5.15);

      /* — Scene 3 (6.5–9.75s): the claim clears upward, the wordmark lands alone — */
      tl.to("#f12-close-claim",
        { opacity: 0, y: -190, duration: 0.7, ease: "power2.in" }, 6.5);
      tl.to("#f12-close-rail",
        { opacity: 0.1, duration: 0.9, ease: "power3.out" }, 6.45);

      /* the film's one overshoot — small, on the wordmark */
      tl.fromTo("#f12-close-wordmark",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 1.0, ease: "back.out(1.35)" }, 7.35);
      tl.fromTo("#f12-close-spike",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 7.5);

      /* the repo line types beneath, then everything stops */

        { opacity: 0 },
        { opacity: 1, duration: 0.01, stagger: 0.019, ease: "none" }, 7.95);

      /* held to the end — no drift, no glow, no sting */
      tl.to({}, { duration: 9.75 }, 0);
