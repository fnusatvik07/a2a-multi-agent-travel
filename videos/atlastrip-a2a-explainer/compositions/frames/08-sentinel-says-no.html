    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var q = function (s) { return document.querySelector(s); };

      var wire1 = q("#f08-wire1");
      var route2 = q("#f08-route2");
      var env1 = q("#f08-env1");
      var env1h = q("#f08-env1h");
      var env2 = q("#f08-env2");

      function prep(el) {
        var l = el.getTotalLength();
        gsap.set(el, { strokeDasharray: l, strokeDashoffset: l });
        return l;
      }
      function draw(el, dur, at, ease) {
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power3.out" }, at);
      }
      function place(el, path, p) {
        var pt = path.getPointAtLength(path.getTotalLength() * p);
        gsap.set(el, { x: pt.x, y: pt.y });
      }
      function travel(el, path, from, to, dur, at) {
        var len = path.getTotalLength();
        var o = { p: from };
        tl.to(o, {
          p: to, duration: dur, ease: "power3.inOut",
          onUpdate: function () {
            var pt = path.getPointAtLength(o.p * len);
            gsap.set(el, { x: pt.x, y: pt.y });
          }
        }, at);
      }

      /* --- static prep --- */
      prep(wire1); prep(route2);
      prep(q("#f08-crossrule")); prep(q("#f08-dimline"));
      prep(q("#f08-arrowA")); prep(q("#f08-headA"));
      prep(q("#f08-arrowB")); prep(q("#f08-headB"));
      prep(q("#f08-strikeA")); prep(q("#f08-strikeB"));

      gsap.set([env1, env1h, env2], { autoAlpha: 0 });
      place(env1, wire1, 0);
      place(env1h, wire1, 1);
      place(env2, route2, 0);
      gsap.set("#f08-ghosts", { opacity: .26 });
      gsap.set("#f08-strikes", { opacity: .62 });
      gsap.set("#f08-k2, #f08-k3", { opacity: .26 });

      /* ===================== SCENE 1 — THE REFUSAL (0.0–4.4) ===================== */
      tl.fromTo("#f08-kicker", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: .55, ease: "power3.out" }, 0);

      tl.fromTo("#f08-ag-conc, #f08-ag-sent, #f08-ag-hearth",
        { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .55, stagger: .07, ease: "power3.out" }, .05);
      tl.fromTo(".f08-dim", { autoAlpha: 0, y: 12 }, { autoAlpha: .22, y: 0, duration: .6, stagger: .07, ease: "power3.out" }, .18);
      tl.fromTo("#f08-card", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: .6, ease: "power3.out" }, .15);

      draw(wire1, .6, .45);
      tl.fromTo(env1, { autoAlpha: 0, scale: .7 }, { autoAlpha: 1, scale: 1, duration: .32, ease: "power3.out" }, .78);
      travel(env1, wire1, 0, 1, 1.35, .9);

      /* the shield brightens */
      tl.to("#f08-disc-sent", { opacity: 1, duration: .45, ease: "power3.out" }, 2.24);
      tl.to("#f08-glyph-sent", { scale: 1.06, duration: .45, ease: "power3.out" }, 2.24);
      /* the coral cross-rule strikes */
      draw(q("#f08-crossrule"), .5, 2.6);

      /* solid -> hollow + coral, at the same centre */
      tl.to(env1, { autoAlpha: 0, scale: .94, duration: .28, ease: "power3.out" }, 3.14);
      tl.fromTo(env1h, { autoAlpha: 0, scale: .94 }, { autoAlpha: 1, scale: 1, duration: .28, ease: "power3.out" }, 3.14);
      tl.to(wire1, { attr: { stroke: "#CC785C" }, opacity: .5, duration: .3, ease: "power3.out" }, 3.4);

      /* back along the same wire, landing on the Concierge */
      travel(env1h, wire1, 1, 0, .95, 3.45);
      tl.to(env1h, { scale: 1.05, duration: .14, ease: "power3.out" }, 4.4);
      tl.to(env1h, { scale: 1, duration: .3, ease: "power3.out" }, 4.54);

      /* ===================== SCENE 2 — THE REASON (4.4–8.4) ===================== */
      tl.to("#f08-k1", { opacity: .26, duration: .3, ease: "power3.out" }, 4.5);
      tl.to("#f08-k2", { opacity: 1, duration: .3, ease: "power3.out" }, 4.5);

      /* the envelope opens into the ruling */
      tl.to(env1h, { autoAlpha: 0, duration: .28, ease: "power3.out" }, 4.6);
      tl.fromTo("#f08-panel", { height: 0, autoAlpha: 0 }, { height: 420, autoAlpha: 1, duration: .55, ease: "power3.out" }, 4.58);
      tl.fromTo("#f08-pkick", { autoAlpha: 0 }, { autoAlpha: 1, duration: .35, ease: "power3.out" }, 4.95);

      tl.fromTo("#f08-pnum-a", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: .45, ease: "power3.out" }, 5.1);
      tl.fromTo("#f08-pnum-b", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: .45, ease: "power3.out" }, 5.7);

      /* the measurement line draws between them */
      draw(q("#f08-dimline"), .6, 6.3);
      tl.fromTo("#f08-tick1, #f08-tick2", { opacity: 0 }, { opacity: .55, duration: .3, stagger: .1, ease: "power3.out" }, 6.62);

      /* the difference, in coral */
      tl.fromTo("#f08-pdelta", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: .5, ease: "power3.out" }, 7.05);

      /* Sentinel's own words */
      tl.fromTo("#f08-prule", { scaleX: 0 }, { scaleX: 1, duration: .4, ease: "power3.out" }, 7.6);
      tl.fromTo(".f08-w", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .4, stagger: .05, ease: "power3.out" }, 7.8);

      /* ===================== SCENE 3 — WHAT IT DOES NOT DO (8.4–13.6) ============ */
      tl.to("#f08-k2", { opacity: .26, duration: .3, ease: "power3.out" }, 8.42);
      tl.to("#f08-k3", { opacity: 1, duration: .3, ease: "power3.out" }, 8.42);

      draw(q("#f08-arrowA"), .55, 8.55);
      draw(q("#f08-headA"), .22, 9.02);
      tl.fromTo("#f08-gl-a", { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: .4, ease: "power3.out" }, 8.95);

      draw(q("#f08-arrowB"), .55, 9.4);
      draw(q("#f08-headB"), .22, 9.87);
      tl.fromTo("#f08-gl-b", { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: .4, ease: "power3.out" }, 9.8);

      /* struck through */
      draw(q("#f08-strikeA"), .45, 10.35);
      tl.fromTo("#f08-gl-a i", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power3.out" }, 10.35);
      draw(q("#f08-strikeB"), .45, 11.05);
      tl.fromTo("#f08-gl-b i", { scaleX: 0 }, { scaleX: 1, duration: .45, ease: "power3.out" }, 11.05);

      /* and dismissed */
      tl.to("#f08-ghosts, #f08-strikes", { autoAlpha: 0, duration: .6, ease: "power3.out" }, 11.95);
      tl.to("#f08-gl-a, #f08-gl-b", { autoAlpha: 0, y: -8, duration: .6, ease: "power3.out" }, 11.95);

      /* nothing was chosen: the card has not moved */
      tl.fromTo("#f08-note", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: .5, ease: "power3.out" }, 12.65);
