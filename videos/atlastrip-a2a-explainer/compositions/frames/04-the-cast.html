  <script>
    (function () {
      var D = 14.976;
      var q = function (s) {
        return document.querySelector(s);
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------------------------------------------------------------
         Scene 1 (0.0–2.6s) — "Five services, five ports, five frameworks."
         Ground + hairline grid, then five EMPTY hairline outlines pop into
         their final positions in one staggered cascade (smooth power3
         settle, no overshoot — this film's motion grammar).
      --------------------------------------------------------------- */
      tl.fromTo("#c4-grid", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo(
        "#c4-kicker-left",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.05,
      );
      tl.fromTo(
        "#c4-kicker-right",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.22,
      );

      var POP = [
        { sel: "#c4-card-hub", at: 0.18 },
        { sel: "#c4-card-0", at: 0.75 },
        { sel: "#c4-card-1", at: 1.15 },
        { sel: "#c4-card-2", at: 1.55 },
        { sel: "#c4-card-3", at: 1.95 },
      ];
      POP.forEach(function (p) {
        tl.fromTo(
          p.sel,
          { scale: 0.86, opacity: 0, y: 16 },
          { scale: 1, opacity: 0.78, y: 0, duration: 0.78, ease: "power3.out" },
          p.at,
        );
      });

      /* ---------------------------------------------------------------
         SVG self-draw setup — measured lengths, dash pattern per path.
      --------------------------------------------------------------- */
      var wires = document.querySelectorAll("#c4-wires path");
      var LEN = {};
      wires.forEach(function (p) {
        var len =
          typeof p.getTotalLength === "function" ? p.getTotalLength() : Number(p.dataset.len);
        if (!len || !isFinite(len)) len = Number(p.dataset.len);
        LEN[p.id] = len;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      var draw = function (id, at, dur) {
        tl.fromTo(
          "#" + id,
          { strokeDashoffset: LEN[id] },
          { strokeDashoffset: 0, duration: dur, ease: "power2.out", immediateRender: false },
          at,
        );
      };

      /* ---------------------------------------------------------------
         "Filling" a card — it comes FORWARD (0.78 → full, cream → tile, hairline lift),
         and its type arrives on the spoken word that names it.
      --------------------------------------------------------------- */
      var fill = function (sel, cardAt, nameAt, fwAt, portAt) {
        tl.fromTo(
          sel,
          { opacity: 0.78 },
          { opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
          cardAt,
        );
        tl.fromTo(
          sel,
          { backgroundColor: "#faf9f5" },
          { backgroundColor: "#efe9de", duration: 0.6, ease: "power2.out", immediateRender: false },
          cardAt,
        );
        tl.fromTo(
          sel + " .c4-lift",
          { opacity: 0 },
          { opacity: 1, duration: 0.7, ease: "power2.out", immediateRender: false },
          cardAt,
        );
        tl.fromTo(
          sel + " .c4-name",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", immediateRender: false },
          nameAt,
        );
        tl.fromTo(
          sel + " .c4-fw",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false },
          fwAt,
        );
        tl.fromTo(
          sel + " .c4-port",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false },
          portAt,
        );
      };

      /* Scene 2 (2.6–5.0s) — "A concierge on LangGraph."
         The top card fills and its stem draws DOWN toward the row. */
      fill("#c4-card-hub", 3.02, 3.07, 3.89, 4.34);
      draw("c4-wire-stem", 4.3, 0.55);

      /* Scene 3 (5.0–10.2s) — the four specialists fill left to right, each
         exactly on its spoken cue, each connector drawing UP to the Concierge.
         Unfilled cards stay back as empty cream outlines: asymmetric depth. */
      var SPECS = [
        { sel: "#c4-card-0", card: 4.74, name: 4.78, fw: 5.59, port: 6.15, wire: 5.85 },
        { sel: "#c4-card-1", card: 6.71, name: 6.75, fw: 7.62, port: 8.05, wire: 7.8 },
        { sel: "#c4-card-2", card: 8.4, name: 8.44, fw: 9.08, port: 9.64, wire: 9.4 },
        { sel: "#c4-card-3", card: 10.23, name: 10.27, fw: 10.79, port: 11.52, wire: 11.3 },
      ];
      SPECS.forEach(function (s, i) {
        fill(s.sel, s.card, s.name, s.fw, s.port);
        draw("c4-wire-up-" + i, s.wire, 0.75);
      });

      /* Scene 4 (10.2–15.0s) — "All four specialists read one MCP server."
         The four lift together, then a wide plate slides UP beneath the row
         and four connectors draw down into it at once. */
      tl.fromTo(
        "#c4-card-0, #c4-card-1, #c4-card-2, #c4-card-3",
        { y: 0 },
        { y: -6, duration: 0.55, ease: "power2.out", immediateRender: false },
        12.15,
      );
      tl.fromTo(
        "#c4-plate",
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out", immediateRender: false },
        13.05,
      );
      tl.fromTo(
        "#c4-plate-name",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false },
        13.55,
      );
      tl.fromTo(
        "#c4-plate-port",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false },
        13.98,
      );
      for (var i = 0; i < 4; i++) draw("c4-wire-dn-" + i, 13.9, 0.7);

      /* ---------------------------------------------------------------
         Camera — one slow ~2% push-in under the last beat, plus a barely
         perceptible drift. Three layers move at different rates (0.42 /
         0.72 / 1.0), which is what makes the depth read. Single writer.
      --------------------------------------------------------------- */
      var layers = [
        { el: q("#c4-layer-bg"), f: 0.42 },
        { el: q("#c4-layer-mid"), f: 0.72 },
        { el: q("#c4-layer-fg"), f: 1 },
      ];
      var cam = { s: 1 };
      var drift = { p: 0 };
      var write = function () {
        var dx = Math.sin(drift.p) * 3;
        var dy = Math.sin(drift.p * 1.3) * 2;
        for (var k = 0; k < layers.length; k++) {
          var l = layers[k];
          if (!l.el) continue;
          var s = 1 + (cam.s - 1) * l.f;
          l.el.style.transform =
            "scale(" + s + ") translate(" + dx * l.f + "px," + dy * l.f + "px)";
        }
      };
      write();

      tl.to(cam, { s: 1.02, duration: 1.9, ease: "power2.inOut", onUpdate: write }, 12.6);
      tl.to(drift, { p: Math.PI * 2 * 0.6, duration: D, ease: "none", onUpdate: write }, 0);

      window.__timelines["04-the-cast"] = tl;
    })();
