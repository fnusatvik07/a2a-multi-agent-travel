  <script>
    (function () {
      var ID = "07-what-came-back";
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines[ID] = tl;

      var $ = function (s) { return document.querySelector(s); };

      /* ---- geometry ---- */
      var CARD_W = 660, CARD_H = 400, ENV_W = 120, ENV_H = 48;
      var SIDE = (CARD_W - ENV_W) / 2;   /* 270 */
      var BOT  = CARD_H - ENV_H;         /* 352 */

      /* ---- wire draw-in (svg-path-draw) ---- */
      function armWire(sel, fallback) {
        var p = $(sel);
        var L = (p && p.getTotalLength) ? p.getTotalLength() : fallback;
        if (!L) { L = fallback; }
        if (p) {
          p.style.strokeDasharray = L + " " + L;
          p.style.strokeDashoffset = L;
        }
        return { el: p, len: L };
      }
      var wSky = armWire("#f7-wire-sky", 620);
      var wHea = armWire("#f7-wire-hea", 560);

      /* ---- card unfold (anchored expand, proxy-driven clip window) ---- */
      function unfold(sel, at, dur) {
        var el = $(sel), st = { p: 0 };
        tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.10, ease: "power2.out" }, at);
        tl.fromTo(st, { p: 0 }, {
          p: 1, duration: dur, ease: "power3.out",
          onUpdate: function () {
            var p = st.p;
            el.style.clipPath = "inset(0px " + (SIDE * (1 - p)).toFixed(2) + "px " +
              (BOT * (1 - p)).toFixed(2) + "px " + (SIDE * (1 - p)).toFixed(2) +
              "px round " + (8 + 4 * p).toFixed(2) + "px)";
          }
        }, at);
      }

      /* ---- value-scaled counter (counting-dynamic-scale) ---- */
      function countUp(figSel, rowSel, target, at, dur) {
        var fig = $(figSel), st = { v: 0 };
        tl.fromTo($(rowSel), { opacity: 0 }, { opacity: 1, duration: 0.30, ease: "power2.out" }, at);
        tl.fromTo(st, { v: 0 }, {
          v: target, duration: dur, ease: "power3.out",
          onUpdate: function () {
            fig.textContent = st.v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
          }
        }, at);
        tl.fromTo($(rowSel), { scale: 0.52 }, { scale: 1, duration: dur, ease: "power3.out" }, at);
      }

      /* ---- envelope leg: agent -> Concierge -> its card slot ---- */
      function envelope(cfg) {
        var env = cfg.env, flap = cfg.flap;
        tl.fromTo(env, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, cfg.t);
        tl.fromTo(env, { scale: 0.68 }, { scale: 1, duration: 0.52, ease: "power3.out" }, cfg.t);
        tl.fromTo(env, { x: cfg.x0 }, { x: cfg.xHub, duration: 0.95, ease: "power2.in" }, cfg.t);
        tl.fromTo(env, { y: cfg.y0 }, { y: -46, duration: 0.95, ease: "power2.out" }, cfg.t);
        tl.fromTo(env, { rotation: cfg.rot }, { rotation: 0, duration: 0.80, ease: "power3.out" }, cfg.t);
        /* the Concierge takes delivery */
        tl.fromTo("#f7-glyph-hub", { scale: 1 }, { scale: 1.09, duration: 0.14, ease: "power2.out", immediateRender: false }, cfg.t + 0.95);
        tl.fromTo("#f7-glyph-hub", { scale: 1.09 }, { scale: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, cfg.t + 1.09);
        tl.fromTo("#f7-glyph-hub", { opacity: 0.72 }, { opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, cfg.t + 0.95);
        tl.fromTo("#f7-glyph-hub", { opacity: 1 }, { opacity: 0.72, duration: 0.50, ease: "power3.out", immediateRender: false }, cfg.t + 1.20);
        /* laid down in its slot */
        tl.fromTo(env, { x: cfg.xHub }, { x: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, cfg.t + 1.12);
        tl.fromTo(env, { y: -46 }, { y: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, cfg.t + 1.12);
        /* the flap lifts */
        tl.fromTo(flap, { scaleY: 1 }, { scaleY: -0.75, duration: 0.22, ease: "power3.out" }, cfg.t + 1.54);
        tl.fromTo(flap, { opacity: 1 }, { opacity: 0.45, duration: 0.22, ease: "power3.out", immediateRender: false }, cfg.t + 1.54);
        /* ...and it opens into the card */
        unfold(cfg.card, cfg.t + 1.62, 0.62);
        tl.fromTo(env, { opacity: 1 }, { opacity: 0, duration: 0.34, ease: "power2.out", immediateRender: false }, cfg.t + 1.72);
      }

      /* ================= Scene 0 — the ground ================= */
      tl.fromTo("#f7-ground", { opacity: 0 }, { opacity: 1, duration: 0.40, ease: "power3.out" }, 0);
      tl.fromTo("#f7-kicker", { y: 10 }, { y: 0, duration: 0.60, ease: "power3.out" }, 0);

      /* ================= Scene 1 (0.0-6.4) — Skyline answers ================= */
      tl.fromTo("#f7-glyph-sky", { opacity: 0.32 }, { opacity: 0.85, duration: 0.40, ease: "power3.out" }, 0.15);
      tl.fromTo(wSky.el, { opacity: 0 }, { opacity: 1, duration: 0.20, ease: "power2.out" }, 0.15);
      tl.fromTo(wSky.el, { strokeDashoffset: wSky.len }, { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 0.15);

      envelope({
        env: "#f7-env-sky", flap: "#f7-flap-sky", card: "#f7-card-sky",
        t: 0.18, x0: -100, y0: 462, xHub: 380, rot: -14
      });

      tl.fromTo("#f7-src-sky", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 2.02);
      tl.fromTo("#f7-name-sky", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 2.24);
      tl.fromTo("#f7-detail-sky", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 2.96);
      tl.fromTo("#f7-rule-sky", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 3.32);
      countUp("#f7-fig-sky", "#f7-val-sky", 3110.48, 3.72, 1.76);

      /* ================= Scene 2 (6.4-12.2) — Hearth answers ================= */
      tl.fromTo("#f7-glyph-hea", { opacity: 0.32 }, { opacity: 0.85, duration: 0.40, ease: "power3.out" }, 6.45);
      tl.fromTo(wHea.el, { opacity: 0 }, { opacity: 1, duration: 0.20, ease: "power2.out" }, 6.45);
      tl.fromTo(wHea.el, { strokeDashoffset: wHea.len }, { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 6.45);

      envelope({
        env: "#f7-env-hea", flap: "#f7-flap-hea", card: "#f7-card-hea",
        t: 6.48, x0: -540, y0: 462, xHub: -380, rot: -14
      });

      tl.fromTo("#f7-src-hea", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.40, ease: "power3.out" }, 8.32);
      tl.fromTo("#f7-name-hea", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 8.54);
      tl.fromTo("#f7-detail-hea", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 9.24);
      tl.fromTo("#f7-rule-hea", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 9.62);
      countUp("#f7-fig-hea", "#f7-val-hea", 298.33, 10.05, 1.72);
      tl.fromTo("#f7-unit-hea", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.36, ease: "power3.out" }, 11.80);

      /* ================= Scene 3 (12.2-13.75) — one number left alone ================= */
      tl.fromTo("#f7-card-sky", { opacity: 1 }, { opacity: 0.5, duration: 0.78, ease: "power3.out", immediateRender: false }, 12.30);
      tl.fromTo("#f7-ground", { opacity: 1 }, { opacity: 0.26, duration: 0.82, ease: "power3.out", immediateRender: false }, 12.40);
      tl.fromTo(["#f7-src-hea", "#f7-name-hea", "#f7-detail-hea", "#f7-rule-hea"],
        { opacity: 1 }, { opacity: 0.30, duration: 0.82, ease: "power3.out", immediateRender: false }, 12.50);
      tl.fromTo("#f7-surf-hea", { opacity: 1 }, { opacity: 0.40, duration: 0.82, ease: "power3.out", immediateRender: false }, 12.50);

      /* pin the shot to its full length */
      tl.to({ v: 0 }, { v: 1, duration: 0.01 }, 13.74);
    })();
  </script>
