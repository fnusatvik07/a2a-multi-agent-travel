  <script>
    (function () {
      var g = window.gsap;
      var host = document.querySelector('[data-composition-id="03-the-team"]');
      if (!g || !host) return;
      var byId = function (id) { return host.querySelector("#" + id); };
      var all = function (sel) { return Array.prototype.slice.call(host.querySelectorAll(sel)); };

      window.__timelines = window.__timelines || {};
      var tl = g.timeline({ paused: true });
      window.__timelines["03-the-team"] = tl;

      var icons = [byId("f03-team-icon-0"), byId("f03-team-icon-1"), byId("f03-team-icon-2"), byId("f03-team-icon-3")];
      var cards = [byId("f03-team-card-0"), byId("f03-team-card-1"), byId("f03-team-card-2"), byId("f03-team-card-3")];
      var names = [byId("f03-team-name-0"), byId("f03-team-name-1"), byId("f03-team-name-2"), byId("f03-team-name-3")];
      var jobs  = [byId("f03-team-job-0"),  byId("f03-team-job-1"),  byId("f03-team-job-2"),  byId("f03-team-job-3")];

      /* ---- camera: slow ~2% push-in that runs underneath and stops ---- */
      tl.fromTo(byId("f03-team-camera"),
        { scale: 1 },
        { scale: 1.02, duration: 14.5, ease: "power2.out" }, 0);

      /* ---- Scene 1 (0.0-2.2): the four icons slide out of the strip into card slots ---- */
      tl.fromTo(byId("f03-team-grid"),
        { opacity: 0 },
        { opacity: 1, duration: 0.9, ease: "power2.out" }, 0);

      icons.forEach(function (el, i) {
        tl.fromTo(el, { y: -150 }, { y: 0, duration: 1.15, ease: "power3.out" }, 0 + i * 0.06);
      });

      cards.forEach(function (el, i) {
        tl.fromTo(el,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.1 + i * 0.1);
      });

      tl.fromTo(byId("f03-team-kicker"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.35);

      /* ---- Scene 2 (2.2-9.6): each card takes its name on its own spoken cue ---- */
      var cues = [2.30, 4.15, 6.05, 7.95];
      cues.forEach(function (t, i) {
        tl.fromTo(names[i],
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" }, t);
        tl.fromTo(icons[i],
          { opacity: 0.5 },
          { opacity: 1, duration: 0.6, ease: "power2.out" }, t + 0.05);
        tl.fromTo(cards[i],
          { borderColor: "rgba(20,20,19,0.12)" },
          { borderColor: "rgba(20,20,19,0.22)", duration: 0.8, ease: "power2.out" }, t + 0.05);
        tl.fromTo(jobs[i],
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, t + 0.3);
      });

      /* ---- Scene 3 (9.6-13.4): the Concierge arrives above, its bell draws itself,
             then the desk rule extends down to each of the four ---- */
      tl.fromTo(byId("f03-team-lead"),
        { opacity: 0, y: -26 },
        { opacity: 1, y: 0, duration: 0.95, ease: "power3.out" }, 9.7);

      tl.fromTo(byId("f03-team-bell-dome"),
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 9.95);
      tl.fromTo(byId("f03-team-bell-base"),
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 10.35);
      tl.fromTo(byId("f03-team-bell-button"),
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 10.6);

      tl.fromTo(byId("f03-team-lead-name"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 10.55);
      tl.fromTo(byId("f03-team-lead-job"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 11.0);

      tl.fromTo(byId("f03-team-stem"),
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 11.5);
      tl.fromTo(byId("f03-team-spine"),
        { strokeDashoffset: 100 },
        { strokeDashoffset: 0, duration: 1.15, ease: "power3.out" }, 11.9);

      all(".f03-team-drop").forEach(function (el, i) {
        tl.fromTo(el,
          { strokeDashoffset: 100 },
          { strokeDashoffset: 0, duration: 0.55, ease: "power3.out" }, 12.8 + i * 0.17);
      });

      /* ---- Scene 4 (13.4-16.25): the assembly settles; the junctions punctuate ---- */
      all(".f03-team-node").forEach(function (el, i) {
        tl.fromTo(el,
          { attr: { r: 0 } },
          { attr: { r: 3.5 }, duration: 0.5, ease: "power3.out" }, 13.95 + i * 0.07);
      });
    })();
  </script>
