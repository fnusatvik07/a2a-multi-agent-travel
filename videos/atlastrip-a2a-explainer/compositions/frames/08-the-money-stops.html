  <div id="root" data-composition-id="08-the-money-stops" data-width="1920" data-height="1080">

      data-start="0"

      data-track-index="0"
    ></div>

    <div class="kicker mono" id="mstop-kicker">Ledger · budget check</div>

    <div class="total-label mono" id="mstop-total-label" data-layout-allow-overlap>Trip total</div>
    <div class="total-wrap" id="mstop-total-wrap">
      <span class="total" id="mstop-total" data-layout-allow-overlap>$0.00</span>

        <svg class="tick" width="26" height="20" viewBox="0 0 26 20" fill="none" aria-hidden="true">

        </svg>

      </div>

        <svg class="tick" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">

      </div>

  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var TOTAL = 3688.76;
      var BUDGET = 7600;
      var FILL_PCT = TOTAL / BUDGET; // 0.4853632 — just under half
      var COUNT_AT = 2.35;
      var COUNT_DUR = 1.3;
      var COUNT_EASE = "power3.out";

      var counter = document.getElementById("mstop-total");
      var state = { value: 0 };

      function money(v) {
        var s = v.toFixed(2);
        var parts = s.split(".");
        return (
          "$" + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + parts[1]
        );
      }

      /* ---------- Scene 1 (0.0–2.4s) — the frame clears to cream, the budget bar draws ---------- */
      tl.fromTo(
        "#mstop-kicker",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.1
      );

      // hero lockup present early, held dim until the money is spoken
      tl.fromTo(
        "#mstop-total-wrap",
        { opacity: 0, y: 18 },
        { opacity: 0.3, y: 0, duration: 0.55, ease: "power3.out" },
        0.25
      );
      tl.fromTo(
        "#mstop-total-label",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.3
      );

      // the bar draws across the middle (wipe, left → right)
      tl.fromTo(
        "#mstop-bar-wrap",
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "power3.out" },
        0.4
      );
      tl.fromTo(
        "#mstop-budget",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        1.35
      );

      /* ---------- Scene 2 (2.4–4.4s) — the total counts up, the fill sweeps, it reads as a yes ---------- */
      tl.to("#mstop-total-wrap", { opacity: 1, duration: 0.35, ease: "power2.out" }, 2.3);

      tl.to(
        state,
        {
          value: TOTAL,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: function () {
            counter.textContent = money(state.value);
          }
        },
        COUNT_AT
      );
      tl.fromTo(
        "#mstop-total",
        { scale: 0.58 },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );
      // the fill shares the count's timing + ease so number and bar land as one beat
      tl.fromTo(
        "#mstop-fill",
        { scaleX: 0 },
        { scaleX: FILL_PCT, duration: COUNT_DUR, ease: COUNT_EASE },
        COUNT_AT
      );

      // "fits" — for one beat this looks like a yes
      tl.fromTo(
        "#mstop-chip-fits",
        { opacity: 0, scale: 1.18, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        3.75
      );

      /* ---------- Scene 3 (4.4–7.637s) — the threshold drops, the money stops ---------- */
      tl.fromTo(
        "#mstop-thr-line",
        { opacity: 0, y: -34 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        4.45
      );
      tl.fromTo(
        "#mstop-thr-label",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
        4.7
      );
      tl.fromTo(
        "#mstop-over",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        4.95
      );

      // the fill freezes: a hard ink cap slams onto its leading edge
      tl.fromTo(
        "#mstop-cap",
        { opacity: 0, scaleY: 0.2 },
        { opacity: 1, scaleY: 1, duration: 0.22, ease: "power4.out" },
        5.15
      );

      // fits → HELD, cut on the Z axis (inverse zoom-through: an arrival, held)
      tl.to(
        "#mstop-chip-fits",
        { scale: 0.8, filter: "blur(10px)", duration: 0.2, ease: "power3.in" },
        5.35
      );
      tl.to("#mstop-chip-fits", { opacity: 0.15, duration: 0.2, ease: "none" }, 5.35);
      tl.set("#mstop-chip-fits", { opacity: 0 }, 5.55);
      tl.set("#mstop-chip-held", { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, 5.55);
      tl.to(
        "#mstop-chip-held",
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        5.55
      );

      // the state stamps beneath
      tl.fromTo(
        "#mstop-stamp",
        { opacity: 0, scale: 1.05 },
        { opacity: 1, scale: 1, duration: 0.26, ease: "power4.out" },
        5.82
      );

      /* ---------- Held (6.1–7.637s) — nothing moves but the stamp's jitter ---------- */
      var jitter = [
        [0.9, -0.5],
        [-0.7, 0.6],
        [0.5, -0.4],
        [-0.8, 0.3],
        [0.6, 0.5],
        [-0.4, -0.6],
        [0.7, 0.4],
        [-0.5, -0.3],
        [0.4, 0.6],
        [-0.6, -0.4]
      ];
      var jAt = 6.1;
      var jStep = 0.14;
      for (var i = 0; i < jitter.length; i++) {
        tl.to(
          "#mstop-stamp",
          { x: jitter[i][0], y: jitter[i][1], duration: jStep, ease: "none" },
          jAt + i * jStep
        );
      }
      tl.to("#mstop-stamp", { x: 0, y: 0, duration: 0.13, ease: "none" }, jAt + jitter.length * jStep);

      window.__timelines["08-the-money-stops"] = tl;
    })();
  </script>
