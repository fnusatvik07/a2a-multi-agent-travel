  <script>
    (function () {
      var DUR = 6.763;
      var FULL =
        "Mira Halvorsen needs to be in Tokyo for the Kaisei customer review, 14 to 17 October.";

      var typedEl = document.getElementById("fr05-typed");
      var caretEl = document.getElementById("fr05-caret");
      var countEl = document.getElementById("fr05-count");
      var fillEl = document.getElementById("fr05-fill");
      var world = document.getElementById("fr05-world");

      /* ── typing schedule: real rhythm — deliberate on the names, fast on the
         common words, a beat of pause at the comma. Pure function of time, so
         every seek (forward or back) renders the same characters. ─────────── */
      var TYPE_IN = 1.2;
      var idx = function (s) {
        return FULL.indexOf(s);
      };
      var SEG = [
        { c0: 0, c1: idx("needs"), d: 0.62 }, // "Mira Halvorsen "
        { c0: idx("needs"), c1: idx("Tokyo"), d: 0.6 }, // "needs to be in "
        { c0: idx("Tokyo"), c1: idx("for"), d: 0.34 }, // "Tokyo "
        { c0: idx("for"), c1: idx("Kaisei"), d: 0.3 }, // "for the "
        { c0: idx("Kaisei"), c1: idx("customer"), d: 0.4 }, // "Kaisei "
        { c0: idx("customer"), c1: idx(",") + 1, d: 0.7 }, // "customer review,"
        { c0: idx(",") + 1, c1: idx("October"), d: 0.5, gapBefore: 0.26 }, // comma pause, then " 14 to 17 "
        { c0: idx("October"), c1: FULL.length, d: 0.48 } // "October."
      ];
      var at = TYPE_IN;
      for (var i = 0; i < SEG.length; i++) {
        at += SEG[i].gapBefore || 0;
        SEG[i].t0 = at;
        at += SEG[i].d;
        SEG[i].t1 = at;
      }
      var TYPE_END = at; // 5.40s

      function charsAt(t) {
        if (t <= SEG[0].t0) return 0;
        if (t >= TYPE_END) return FULL.length;
        for (var i = SEG.length - 1; i >= 0; i--) {
          var s = SEG[i];
          if (t >= s.t1) return s.c1;
          if (t >= s.t0) {
            var p = (t - s.t0) / (s.t1 - s.t0);
            return Math.round(s.c0 + (s.c1 - s.c0) * p);
          }
        }
        return 0;
      }

      // every character landing is a typing event — baked, so the caret's
      // solid-while-typing behaviour is identical at any seek direction.
      var CARET_IN = 0.55;
      var CARET_OUT = 5.55;
      var GRACE = 0.16;
      var BLINK_CYCLES = 8; // whole number over DUR -> period 0.845s

      function pad3(n) {
        return ("00" + n).slice(-3);
      }

      var drv = { t: 0 };
      function render() {
        var t = drv.t;
        var n = charsAt(t);
        typedEl.textContent = FULL.slice(0, n);
        countEl.textContent = pad3(n) + " / " + pad3(FULL.length);
        fillEl.style.width = (n / FULL.length) * 100 + "%";

        var o = 0;
        if (t >= CARET_IN && t < CARET_OUT) {
          var typing = t >= SEG[0].t0 - GRACE && t <= TYPE_END + GRACE;
          o = typing
            ? 1
            : Math.sin(2 * Math.PI * BLINK_CYCLES * (t / DUR)) > 0
              ? 1
              : 0;
        } else if (t >= CARET_OUT) {
          o = 0;
        }
        caretEl.style.opacity = String(o);
      }
      render();

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // one linear driver carries the caret + the typed line + the counter
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: render }, 0);

      /* ── Scene 1 (0.0–1.2s) — the settled network recedes and defocuses to
         ~25%; the empty plate seats in, caret blinking ───────────────────── */
      tl.to(
        world,
        {
          "--dof": "16px",
          opacity: 0.25,
          scale: 0.955,
          duration: 1.2,
          ease: "power3.out"
        },
        0
      );
      tl.fromTo(
        "#fr05-plate",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.64, ease: "power3.out" },
        0.08
      );
      tl.fromTo(
        "#fr05-kicker",
        { opacity: 0, x: -18 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.26
      );
      tl.fromTo(
        "#fr05-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.44
      );
      tl.fromTo(
        "#fr05-meta",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.66
      );

      /* ── Scene 2 (1.2–5.4s) — the request types itself, caret leading.
         (carried by the driver above) ───────────────────────────────────── */

      /* ── Scene 3 (5.4–6.763s) — the caret stops, the plate goes ink-strong
         for one beat and settles, `sent` appears at the plate's right edge,
         and the network behind brightens very slightly, as if waking ─────── */
      tl.to(

          ease: "power2.out"
        },

      tl.to(

        },

      tl.fromTo(
        "#fr05-line",

        { y: 0, duration: 0.5, ease: "power3.out" },
        5.46
      );
      tl.fromTo(
        "#fr05-sent",
        { opacity: 0, y: 8, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.44, ease: "power3.out" },
        5.62
      );
      tl.to(

        { "--dof": "13px", opacity: 0.32, duration: 0.9, ease: "power2.out" },
        5.68
      );

      window.__timelines["05-one-sentence"] = tl;
    })();
