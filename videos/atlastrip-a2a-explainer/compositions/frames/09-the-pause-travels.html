  <script>
    (function () {
      var DUR = 8.969; /* frame window (voice 8.469 + tail) */

      var world = document.getElementById("f09-world");
      var rail = document.getElementById("f09-rail");
      var headline = document.getElementById("f09-headline");
      var st2 = document.getElementById("f09-st2");
      var ring = document.getElementById("f09-ring");
      var addr = document.getElementById("f09-person-addr");
      var ask = document.getElementById("f09-person-ask");
      var yes = document.getElementById("f09-person-yes");
      var yesRule = document.getElementById("f09-person-rule");
      var chip2 = document.getElementById("f09-chip2");
      var chip1Box = document.getElementById("f09-chip1-box");
      var chip2Box = document.getElementById("f09-chip2-box");
      var chip1Text = document.getElementById("f09-chip1-text");
      var chip2Text = document.getElementById("f09-chip2-text");
      var auth = document.getElementById("f09-auth");
      var pulse = document.getElementById("f09-pulse");

      /* ---------------- virtual camera (viewport-change, PAN mode) ----------------
         One .world wrapper, transform-origin 0 0, transform = translate(x,y) scale(S).
         CSS applies scale first, so screen = (S*wx + x, S*wy + y). Locking the rail
         (world y 520) to screen y 520 gives camY = 520 - S*520; centring a station at
         screen ANCHOR gives camX = ANCHOR - S*stationX. Micro-drift is added in the
         single writer so the camera never sits perfectly dead. */
      var RAIL_Y = 520;
      var cam = { s: 1.3, x: -288 };
      var drift = { p: 0 };

      function applyCamera() {
        var s = cam.s;
        var x = cam.x + Math.sin(drift.p) * 6;
        var y = RAIL_Y - s * RAIL_Y + Math.sin(drift.p * 1.3) * 4;
        world.style.transform = "translate(" + x + "px, " + y + "px) scale(" + s + ")";
      }

      /* the travelling state — its own writer, never gsap-transformed directly */
      var pw = { x: 960 };
      var po = { o: 0 };
      var wob = { p: 0 };
      function applyPulse() {
        pulse.style.transform = "translate(" + pw.x + "px, 0px)";
        pulse.style.opacity = String(po.o * (0.62 + 0.38 * Math.cos(wob.p)));
      }

      applyCamera();
      applyPulse();

      /* ---------------- discrete state (driven off absolute time) ---------------- */
      var HEADLINE = [
        { t: 0.0, text: "" },
        { t: 0.18, text: "Not fails." },
        { t: 0.98, text: "" },
        { t: 1.16, text: "Stops, and waits." }
      ];
      var FLIP_2 = 7.4;
      var FLIP_1 = 7.95;
      var APPROVE_AT = 6.5;

      function textAt(time) {
        for (var i = HEADLINE.length - 1; i >= 0; i--) {
          if (time >= HEADLINE[i].t) return HEADLINE[i].text;
        }
        return "";
      }
      function setChip(box, label, done) {
        var cls = done ? "f09-chip is-done" : "f09-chip";
        if (box.className !== cls) box.className = cls;
        if (label.textContent !== (done ? "COMPLETED" : "INPUT_REQUIRED")) {
          label.textContent = done ? "COMPLETED" : "INPUT_REQUIRED";
        }
      }
      var driver = { t: 0 };
      function renderStates() {
        var t = driver.t;
        var h = textAt(t);
        if (headline.textContent !== h) headline.textContent = h;
        setChip(chip1Box, chip1Text, t >= FLIP_1);
        setChip(chip2Box, chip2Text, t >= FLIP_2);
        var cls = t >= APPROVE_AT ? "is-done" : "";
        if (pulse.className !== cls) pulse.className = cls;
      }
      renderStates();

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* full-span state driver + camera micro-drift */
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: renderStates }, 0);
      tl.to(
        drift,
        { p: Math.PI * 2 * 1.15, duration: DUR, ease: "none", onUpdate: applyCamera },
        0
      );

      /* ===== Scene 1 (0.0–2.0) — pull back off the stamp; the word swap ===== */
      tl.to(
        cam,
        { s: 1.0, x: -300, duration: 1.15, ease: "power2.inOut", onUpdate: applyCamera },
        0.05
      );
      tl.fromTo(
        rail,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.95, ease: "power3.out" },
        0.15
      );
      tl.fromTo(
        headline,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        0.18
      );
      /* pre-placed stations, unlit */
      tl.fromTo(st2, { opacity: 0 }, { opacity: 0.24, duration: 0.5, ease: "power2.out" }, 0.85);
      tl.fromTo(ring, { opacity: 0 }, { opacity: 0.35, duration: 0.5, ease: "power2.out" }, 1.05);
      /* hard-cut word swap: the line clears, the next one replaces it */
      tl.to(headline, { opacity: 0, duration: 0.1, ease: "none" }, 0.98);
      tl.fromTo(
        headline,
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        1.16
      );

      /* ===== Scene 2 (2.0–4.6) — the pause travels right to CONCIERGE =====
         cut-the-curve: the line rips LEFT at 2.02, the camera pans right (world
         moves left) at 2.20 — same direction, matched velocity across the seam. */
      tl.to(headline, { x: -230, duration: 0.34, ease: "power4.in" }, 2.02);
      tl.to(headline, { opacity: 0, duration: 0.28, ease: "power1.in" }, 2.02);
      tl.to(po, { o: 1, duration: 0.28, ease: "power2.out", onUpdate: applyPulse }, 2.1);
      tl.to(
        cam,
        { x: -820, duration: 0.95, ease: "power2.inOut", onUpdate: applyCamera },
        2.2
      );
      tl.to(
        pw,
        { x: 2100, duration: 0.95, ease: "power2.inOut", onUpdate: applyPulse },
        2.2
      );
      tl.to(st2, { opacity: 1, duration: 0.45, ease: "power2.out" }, 2.85);
      /* the identical stamp lands on the second agent */
      tl.fromTo(chip2, { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power2.out" }, 3.3);
      tl.fromTo(
        chip2Box,
        { scale: 0.88 },
        { scale: 1, duration: 0.34, ease: "power3.out" },
        3.3
      );

      /* ===== Scene 3 (4.6–6.4) — on to the person. no card, no stamp. ===== */
      tl.to(
        cam,
        { x: -2400, duration: 0.95, ease: "power2.inOut", onUpdate: applyCamera },
        4.45
      );
      tl.to(
        pw,
        { x: 3240, duration: 0.95, ease: "power2.inOut", onUpdate: applyPulse },
        4.45
      );
      tl.to(ring, { opacity: 1, duration: 0.3, ease: "power2.out" }, 5.05);
      tl.fromTo(
        addr,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
        5.15
      );
      tl.fromTo(
        ask,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        5.55
      );
      /* it sits alone, waiting — a low-amplitude breathe on the pooled state */
      tl.to(
        wob,
        { p: Math.PI * 4, duration: 1.05, ease: "none", onUpdate: applyPulse },
        5.45
      );

      /* ===== Scene 4 (6.4–8.469) — they approve, and it comes back ===== */
      tl.fromTo(
        yes,
        { opacity: 0, y: 12, scale: 0.96 },
        { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "power3.out" },
        6.5
      );
      tl.fromTo(
        yesRule,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.34, ease: "power2.out" },
        6.62
      );

      /* THE RETURN SWEEP — ONE tween drives camera + state together, so the trip
         back is a single unbroken move. The pulse rides at screen ~840→660 while
         the world streams past it and lands exactly on station one. */
      var sweep = { p: 0 };
      tl.to(
        sweep,
        {
          p: 1,
          duration: 1.1,
          ease: "power2.inOut",
          onUpdate: function () {
            var p = sweep.p;
            cam.x = -2400 + 2100 * p;
            pw.x = 3240 - 2280 * p;
            applyCamera();
            applyPulse();
          }
        },
        6.85
      );
      /* the stamps flip as the sweep passes them (labels come off the driver) */
      tl.fromTo(
        chip2Box,
        { scale: 1.07 },
        { scale: 1, duration: 0.3, ease: "power3.out" },
        FLIP_2
      );
      tl.fromTo(
        chip1Box,
        { scale: 1.07 },
        { scale: 1, duration: 0.3, ease: "power3.out" },
        FLIP_1
      );
      /* lands on station one */
      tl.fromTo(
        auth,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        7.98
      );
      /* settle — a breath of push-in that keeps station one anchored at screen 660 */
      tl.to(
        cam,
        {
          s: 1.045,
          x: -343.2,
          duration: 1.0,
          ease: "power2.out",
          onUpdate: applyCamera
        },
        7.95
      );

      window.__timelines["09-the-pause-travels"] = tl;
    })();
  </script>
