      var E = "power3.out";

      /* ── Scene 1 (0.0–3.6) — the five agents return as ground ── */

        { scaleX: 0 },
        { scaleX: 1, duration: 0.9, ease: E }, 1.65);

      /* ── Scene 2 (3.6–8.0) — MCP draws itself BENEATH the specialists ── */

        { opacity: 0, attr: { x: 1245, width: 0 } },
        { opacity: 1, attr: { x: 700, width: 1090 }, duration: 1.0, ease: E }, 3.70);
