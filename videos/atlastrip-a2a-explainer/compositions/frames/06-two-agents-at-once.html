          <div class="f06-hair f06-r-support" id="f06-hair-r"></div>

  <script>
    (function () {
      var ID = "06-two-agents-at-once";
      if (!window.gsap) return;
      var scope =
        document.querySelector('[data-composition-id="' + ID + '"]') || document;
      var q = function (sel) {
        return scope.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(scope.querySelectorAll(sel));
      };

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* ---------- constants ---------- */
      var L_DONE = 2.3; // left rail completes
      var R_DONE = 4.8; // right rail completes

      var money = function (v) {
        return (
          "$" +
          v.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      };

      /* ---------- initial states (fromTo everywhere; no CSS-hidden heroes) ---------- */
      var valueL = q("#f06-value-l");
      var valueR = q("#f06-value-r");
      valueL.textContent = money(0);
      valueR.textContent = money(0);

      /* ---------- Scene 1 (0.0–2.0): the split, the labels, the rails ---------- */
      tl.fromTo(
        q("#f06-centre-rule"),
        { scaleY: 0, opacity: 1 },
        { scaleY: 1, duration: 0.85, ease: "power3.out" },
        0.04,
      );

      tl.fromTo(
        qa(".f06-label-el"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.09 },
        0.1,
      );

      tl.fromTo(
        qa(".f06-track"),
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.09 },
        0.3,
      );

      /* progress fills — scaleX from a left origin (stat-bars-and-fills) */
      tl.fromTo(
        q("#f06-fill-l"),
        { scaleX: 0 },
        { scaleX: 1, duration: 2.0, ease: "power1.inOut" },
        0.3,
      );
      /* the right lane is deliberately slower: it is still visibly working through Scene 2 */
      tl.fromTo(
        q("#f06-fill-r"),
        { scaleX: 0 },
        { scaleX: 0.58, duration: 3.35, ease: "power1.out" },
        0.35,
      );
      tl.to(q("#f06-fill-r"), { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, 3.7);

      /* in-place status token cycle + diegetic working pulse (discrete-text-sequence) */
      var SEQ_L = [
        [0.0, ""],
        [0.55, "searching fares"],
        [1.3, "12 carriers"],
        [1.85, "comparing cabins"],
        [L_DONE, "fares returned"],
      ];
      var SEQ_R = [
        [0.0, ""],
        [0.65, "searching lodging"],
        [1.7, "84 properties"],
        [2.75, "checking distance"],
        [3.7, "holding rates"],
        [R_DONE, "rate held"],
      ];
      var textAt = function (seq, t) {
        for (var i = seq.length - 1; i >= 0; i--) {
          if (t >= seq[i][0]) return seq[i][1];
        }
        return "";
      };
      var statusL = q("#f06-status-l");
      var statusR = q("#f06-status-r");
      var dotL = q("#f06-dot-l");
      var dotR = q("#f06-dot-r");

      var render = function (t) {
        var a = textAt(SEQ_L, t);
        if (statusL.textContent !== a) statusL.textContent = a;
        var b = textAt(SEQ_R, t);
        if (statusR.textContent !== b) statusR.textContent = b;

        /* pulse performs "the machine is working"; it dies the instant the lane resolves */
        var pl = t < 0.55 ? 0 : t >= L_DONE ? 1 : 0.3 + 0.55 * (0.5 + 0.5 * Math.sin((t - 0.55) * 9));
        var pr = t < 0.65 ? 0 : t >= R_DONE ? 1 : 0.3 + 0.55 * (0.5 + 0.5 * Math.sin((t - 0.65) * 9));
        dotL.style.opacity = String(pl);
        dotR.style.opacity = String(pr);
      };
      render(0);

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: 8.512,
          duration: 8.512,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );

      /* ---------- Scene 2 (2.0–4.8): the LEFT lane lands first ---------- */
      tl.fromTo(
        q("#f06-check-l path"),
        { strokeDashoffset: 26 },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        L_DONE,
      );

      tl.fromTo(
        qa(".f06-row-l"),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.28 },
        2.45,
      );

      tl.fromTo(
        q("#f06-hair-l"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        3.05,
      );

      /* the value lands large on its spoken syllable (counting-dynamic-scale) */
      var stateL = { v: 0 };
      tl.to(
        stateL,
        {
          v: 3110.48,
          duration: 0.95,
          ease: "power2.out",
          onUpdate: function () {
            valueL.textContent = money(stateL.v);
          },
        },
        3.3,
      );
      tl.fromTo(
        valueL,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.95, ease: "power2.out" },
        3.3,
      );

      /* ---------- Scene 3 (4.8–8.5): the RIGHT lane lands second ---------- */
      tl.fromTo(
        q("#f06-check-r path"),
        { strokeDashoffset: 26 },
        { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
        R_DONE,
      );

      tl.fromTo(
        qa(".f06-row-r"),
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out", stagger: 0.3 },
        5.05,
      );

      tl.fromTo(
        q("#f06-hair-r"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        6.0,
      );

      var stateR = { v: 0 };
      tl.to(
        stateR,
        {
          v: 298.33,
          duration: 1.05,
          ease: "power2.out",
          onUpdate: function () {
            valueR.textContent = money(stateR.v);
          },
        },
        6.35,
      );
      tl.fromTo(
        valueR,
        { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 1.05, ease: "power2.out" },
        6.35,
      );
      tl.fromTo(
        q("#f06-unit-r"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        7.4,
      );

      /* the frame resolves onto the hotel price: the finished left lane recedes,
         the right lane's supporting rows step back, the number holds alone and bright */
      tl.to(q("#f06-lane-l"), { opacity: 0.42, duration: 0.7, ease: "power2.out" }, 7.55);
      tl.to(qa(".f06-r-support"), { opacity: 0.48, duration: 0.7, ease: "power2.out" }, 7.7);
      tl.fromTo(
        q("#f06-valuewrap-r"),
        { scale: 1 },
        { scale: 1.035, duration: 0.95, ease: "power2.out" },
        7.55,
      );

      /* one slow, small camera push under the whole shot */
      tl.fromTo(
        q("#f06-stage"),
        { scale: 1 },
        { scale: 1.018, duration: 8.5, ease: "power1.inOut" },
        0,
      );

      window.__timelines[ID] = tl;
    })();
  </script>
