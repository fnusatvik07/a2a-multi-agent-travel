[project]
name = "atlastrip-core"
version = "0.1.0"
description = "Shared domain models, storage adapters and A2A helpers for the AtlasTrip agent network."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server,postgresql]==1.1.2",
    "pydantic>=2.11",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "tinydb>=4.8",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlastrip_core"]
